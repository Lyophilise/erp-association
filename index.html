<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Association</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://stiren-cleguer.com/wp-content/uploads/logo_stiren_cleguer_350px.png-150x150.png">
<meta name="theme-color" content="#2BAD6C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/*
  Identité visuelle réelle du club (récupérée depuis stiren-cleguer.com) :
  jaune #FCF305, vert #2BAD6C, police Rubik (titres) / Karla (texte).
*/
:root{
  --bg:#F7F8F6; --surface:#FFFFFF; --surface-2:#EFF3EC; --border:#DCE3D8;
  --fg:#15241B; --fg-muted:#5C6660; --accent:#2BAD6C; --accent-2:#249E60; --brand-yellow:#FCF305;
  --success:#2F7A4F; --success-bg:#E4F2E8; --warning:#A5680B; --warning-bg:#FBEFD9; --danger:#B3261E; --danger-bg:#FAE3E1;
  --radius:12px; --font-display:'Rubik',sans-serif; --font-body:'Karla',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10150F; --surface:#17201B; --surface-2:#1E2A22; --border:#2A362E;
    --fg:#EDF2EC; --fg-muted:#9AAA9B; --accent:#4FCB8E; --accent-2:#6FDBA3; --brand-yellow:#FCF305;
    --success:#6FCB8E; --success-bg:#1C3327; --warning:#E3B35B; --warning-bg:#3A2E15; --danger:#F08A82; --danger-bg:#3A1E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10150F; --surface:#17201B; --surface-2:#1E2A22; --border:#2A362E;
  --fg:#EDF2EC; --fg-muted:#9AAA9B; --accent:#4FCB8E; --accent-2:#6FDBA3; --brand-yellow:#FCF305;
  --success:#6FCB8E; --success-bg:#1C3327; --warning:#E3B35B; --warning-bg:#3A2E15; --danger:#F08A82; --danger-bg:#3A1E1B;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0}
button{font-family:var(--font-body);cursor:pointer}
input,select,textarea{font-family:var(--font-body);font-size:14px}
table{font-variant-numeric:tabular-nums;width:100%;border-collapse:collapse}
a{color:var(--accent)}

.app{display:flex;min-height:100%;width:100%}
.sidebar{width:232px;flex:0 0 232px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--brand-yellow);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px}
.nav-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);padding:14px 12px 6px;opacity:.75}
.nav-group:first-of-type .nav-group-label{padding-top:2px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--fg-muted);text-align:left;font-size:13.5px;font-weight:500;white-space:nowrap;width:100%}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn.active{background:var(--accent);color:#fff}
.nav-spacer{flex:1}
.nav-foot{padding:10px 12px;border-top:1px solid var(--border);margin-top:8px;display:flex;flex-direction:column;gap:6px}
.nav-ent{font-size:12px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--fg-muted);font-size:12.5px}
.logout:hover{color:var(--danger);border-color:var(--danger)}

.main{flex:1;min-width:0;padding:28px 24px 60px 24px;overflow-x:hidden}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.view-head h1{font-size:22px}
.view-sub{color:var(--fg-muted);font-size:13px;margin-top:2px}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi-label{font-size:12px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:6px}
.kpi.warn .kpi-value{color:var(--warning)}
.kpi.bad .kpi-value{color:var(--danger)}
.kpi.good .kpi-value{color:var(--success)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.card h3{font-size:15px;margin-bottom:12px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
th{background:var(--surface-2);color:var(--fg-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
tbody tr:last-child td{border-bottom:none}
.num{text-align:right}
.empty-row td{color:var(--fg-muted);text-align:center;padding:24px;font-style:italic}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill-ok{background:var(--success-bg);color:var(--success)}
.pill-warn{background:var(--warning-bg);color:var(--warning)}
.pill-bad{background:var(--danger-bg);color:var(--danger)}
.pill-muted{background:var(--surface-2);color:var(--fg-muted)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px}
.auth-mark{width:44px;height:44px;border-radius:12px;background:var(--brand-yellow);display:flex;align-items:center;justify-content:center;margin-bottom:16px;overflow:hidden}
.auth-mark img{width:100%;height:100%;object-fit:contain}
.auth-card h1{font-size:21px;margin-bottom:4px}
.auth-card p{color:var(--fg-muted);font-size:13px;margin-bottom:20px}
.auth-field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.auth-field label{font-size:12px;font-weight:600;color:var(--fg-muted)}
.auth-field input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg)}
.auth-error{background:var(--danger-bg);color:var(--danger);padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.auth-msg{background:var(--success-bg);color:var(--success);padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:12px}

.placeholder-card{border:1px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;color:var(--fg-muted)}
.placeholder-card strong{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}

.setup-banner{background:var(--warning-bg);color:var(--warning);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------------------------------------------------------------
   Configuration Supabase (projet "erp-association")
--------------------------------------------------------------------- */
const SUPABASE_URL = "https://hmeovaorwozazltidhbh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_orYGCskIBIPTK_cpQ-PiHg_-t5JtqCF";

const SETUP_MODE = !SUPABASE_URL || !SUPABASE_ANON_KEY;
const sb = SETUP_MODE ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------------------------------------------------------------
   Définition des modules (nav + roadmap). "ready" = module avec UI/CRUD
   fonctionnel dans cette V1 ; les autres sont des emplacements réservés.
--------------------------------------------------------------------- */
const MODULES = [
  { group: "Vue d'ensemble", items: [
    { key: "dashboard", label: "Tableau de bord", ready: true },
  ]},
  { group: "Vie associative", items: [
    { key: "members", label: "Licences & effectifs", ready: true },
    { key: "finance", label: "Trésorerie", ready: true },
    { key: "staff", label: "Encadrants & bénévoles", ready: true },
    { key: "calendar", label: "Calendrier & matériel", ready: true },
    { key: "tournaments", label: "Tournois (poules & classement)", ready: true },
  ]},
  { group: "Communication & partenaires", items: [
    { key: "comms", label: "Communication", ready: true },
    { key: "sponsors", label: "Partenaires & sponsoring", ready: true },
    { key: "shop", label: "Boutique", ready: true },
    { key: "docs", label: "Documents & gouvernance", ready: true },
  ]},
  { group: "Administration", items: [
    { key: "tasks", label: "Tâches du bureau", ready: true },
    { key: "org_admin", label: "Organisation & invitations", ready: true, adminOnly: true },
  ]},
];

/* ---------------------------------------------------------------------
   État applicatif minimal
--------------------------------------------------------------------- */
const state = {
  session: null,
  orgId: null,
  orgName: null,
  role: null,
  view: "dashboard",
  members: [],
  finance: [],
  loading: false,
  authMode: "signin", // signin | signup
  authError: "",
  installPromptEvent: null,
  currentTournamentId: null,
};

const root = document.getElementById("root");

function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }

function installBannerHtml(){
  if (state.installPromptEvent){
    return `<button class="btn btn-primary" id="install-btn" style="width:100%;margin-top:10px">📱 Installer l'application sur mon téléphone</button>`;
  }
  if (isIOS()){
    return `<div class="auth-msg" style="margin-top:10px">📱 Pour l'installer sur iPhone : bouton <strong>Partager</strong> (le carré avec la flèche) puis <strong>"Sur l'écran d'accueil"</strong>.</div>`;
  }
  return "";
}

function wireInstallBanner(){
  const btn = document.getElementById("install-btn");
  if (!btn) return;
  btn.addEventListener("click", async () => {
    if (!state.installPromptEvent) return;
    state.installPromptEvent.prompt();
    await state.installPromptEvent.userChoice;
    state.installPromptEvent = null;
    render();
  });
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  state.installPromptEvent = e;
  render();
});

function render(){
  if (SETUP_MODE) return renderSetupScreen();
  if (!state.session) return renderAuth();
  return renderApp();
}

/* ---------------------------------------------------------------------
   Écran "projet non configuré"
--------------------------------------------------------------------- */
function renderSetupScreen(){
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-mark">⚙</div>
        <h1>Configuration requise</h1>
        <p>Ce scaffold n'est pas encore relié à un projet Supabase.
        Renseigne <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code>
        en haut de <code>index.html</code>, puis applique la migration
        <code>supabase/migrations/0001_init.sql</code>. Voir le README.</p>
      </div>
    </div>`;
}

/* ---------------------------------------------------------------------
   Auth
--------------------------------------------------------------------- */
function renderAuth(){
  const isSignup = state.authMode === "signup";
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-mark"><img src="https://stiren-cleguer.com/wp-content/uploads/logo_stiren_cleguer_350px.png-150x150.png" alt="Logo"></div>
        <h1>Stiren Cléguer</h1>
        <p>${isSignup ? "Créer un compte" : "Connexion à votre espace association"}</p>
        ${state.authError ? `<div class="auth-error">${state.authError}</div>` : ""}
        <form id="auth-form">
          <div class="auth-field"><label>E-mail</label><input type="email" name="email" required></div>
          <div class="auth-field"><label>Mot de passe</label><input type="password" name="password" required minlength="6"></div>
          <button class="btn btn-primary" type="submit" style="width:100%">${isSignup ? "Créer le compte" : "Se connecter"}</button>
        </form>
        <div class="auth-toggle" style="margin-top:16px;text-align:center;font-size:13px;color:var(--fg-muted)">
          ${isSignup ? "Déjà un compte ?" : "Pas encore de compte ?"}
          <button id="auth-toggle-btn" style="background:none;border:none;color:var(--accent);font-weight:600;padding:0">${isSignup ? "Se connecter" : "Créer un compte"}</button>
        </div>
        ${installBannerHtml()}
      </div>
    </div>`;
  wireInstallBanner();

  document.getElementById("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = fd.get("email"), password = fd.get("password");
    state.authError = "";
    const { error } = isSignup
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    if (error) { state.authError = error.message; render(); return; }
    await loadSession();
  });
  document.getElementById("auth-toggle-btn").addEventListener("click", () => {
    state.authMode = isSignup ? "signin" : "signup";
    render();
  });
}

async function loadSession(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) await loadMembership();
  render();
}

async function loadMembership(){
  const inviteToken = new URLSearchParams(location.search).get("invite");
  if (inviteToken){
    const { error } = await sb.rpc("accept_invite", { invite_token: inviteToken });
    history.replaceState(null, "", location.pathname);
    if (error) alert(`Invitation : ${error.message}`);
  }

  const { data } = await sb
    .from("memberships")
    .select("role, organization_id, organizations(name)")
    .eq("user_id", state.session.user.id)
    .limit(1)
    .maybeSingle();
  if (data){
    state.orgId = data.organization_id;
    state.role = data.role;
    state.orgName = data.organizations?.name || "";
  }
}

/* ---------------------------------------------------------------------
   Shell applicatif
--------------------------------------------------------------------- */
function renderApp(){
  const isAdmin = state.role === "president" || state.role === "bureau";
  const navHtml = MODULES.map(group => {
    const items = group.items.filter(it => !it.adminOnly || isAdmin);
    if (!items.length) return "";
    return `
    <div class="nav-group">
      <div class="nav-group-label">${group.group}</div>
      ${items.map(it => `
        <button class="nav-btn ${state.view === it.key ? "active" : ""}" data-view="${it.key}">${it.label}</button>
      `).join("")}
    </div>
  `;
  }).join("");

  root.innerHTML = `
    <div class="app">
      <nav class="sidebar">
        <div class="brand">
          <div class="brand-mark"><img src="https://stiren-cleguer.com/wp-content/uploads/logo_stiren_cleguer_350px.png-150x150.png" alt="Logo"></div>
          <div class="brand-name">Stiren Cléguer</div>
        </div>
        ${navHtml}
        <div class="nav-spacer"></div>
        <div class="nav-foot">
          ${installBannerHtml()}
          <div class="nav-ent">${state.orgName || "Aucune association liée"}</div>
          <div class="nav-ent" style="font-size:11px">${state.session.user.email}</div>
          <button class="logout" id="logout-btn">Se déconnecter</button>
        </div>
      </nav>
      <main class="main" id="main"></main>
    </div>`;
  wireInstallBanner();

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; render(); });
  });
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    state.session = null; state.orgId = null; render();
  });

  renderView();
}

function renderView(){
  const main = document.getElementById("main");
  if (!state.orgId){
    main.innerHTML = `
      <div class="view-head"><h1>Bienvenue</h1></div>
      <div class="placeholder-card">
        <strong>Aucune association liée à ce compte</strong>
        Demandez une invitation au bureau, ou créez l'organisation initiale
        depuis Supabase (table <code>organizations</code> + <code>memberships</code>).
      </div>`;
    return;
  }

  const allItems = MODULES.flatMap(g => g.items);
  const current = allItems.find(it => it.key === state.view);

  if (!current.ready){
    main.innerHTML = `
      <div class="view-head"><h1>${current.label}</h1></div>
      <div class="placeholder-card">
        <strong>Module à venir</strong>
        ${current.desc || ""}
      </div>`;
    return;
  }

  if (state.view === "dashboard") return renderDashboard(main);
  if (state.view === "members") return renderMembers(main);
  if (state.view === "finance") return renderFinance(main);
  if (state.view === "staff") return renderStaff(main);
  if (state.view === "calendar") return renderCalendar(main);
  if (state.view === "tournaments") return renderTournaments(main);
  if (state.view === "comms") return renderComms(main);
  if (state.view === "sponsors") return renderSponsors(main);
  if (state.view === "shop") return renderShop(main);
  if (state.view === "docs") return renderDocs(main);
  if (state.view === "org_admin") return renderOrgAdmin(main);
  if (state.view === "tasks") return renderTasks(main);
}

/* ---------------------------------------------------------------------
   Dashboard
--------------------------------------------------------------------- */
async function renderDashboard(main){
  const [{ data: members }, { data: tx }, { data: vevents }, { data: signups }, { data: items }] = await Promise.all([
    sb.from("members").select("id, first_name, last_name, licence_status").eq("organization_id", state.orgId),
    sb.from("finance_transactions").select("amount, type").eq("organization_id", state.orgId),
    sb.from("volunteer_events").select("*").eq("organization_id", state.orgId).gte("event_date", new Date().toISOString().slice(0,10)).order("event_date"),
    sb.from("volunteer_signups").select("event_id").eq("organization_id", state.orgId),
    sb.from("equipment_items").select("*").eq("organization_id", state.orgId),
  ]);

  const total = members?.length || 0;
  const paid = members?.filter(m => m.licence_status === "payee").length || 0;
  const unpaid = (members || []).filter(m => m.licence_status !== "payee");
  const solde = (tx || []).reduce((s, t) => s + (t.type === "recette" ? Number(t.amount) : -Number(t.amount)), 0);
  const countSignups = eid => (signups || []).filter(s => s.event_id === eid).length;
  const understaffed = (vevents || []).filter(e => countSignups(e.id) < e.slots_needed);
  const lowStock = (items || []).filter(i => Number(i.quantity) <= 2);

  main.innerHTML = `
    <div class="view-head"><h1>Tableau de bord</h1><div class="view-sub">${state.orgName}</div></div>
    <div class="grid-kpi">
      <div class="kpi"><div class="kpi-label">Licenciés</div><div class="kpi-value">${total}</div></div>
      <div class="kpi ${paid < total ? "warn" : "good"}"><div class="kpi-label">Licences payées</div><div class="kpi-value">${paid}/${total}</div></div>
      <div class="kpi ${solde < 0 ? "bad" : "good"}"><div class="kpi-label">Solde trésorerie</div><div class="kpi-value">${solde.toFixed(2)} €</div></div>
      <div class="kpi ${understaffed.length ? "warn" : "good"}"><div class="kpi-label">Événements sous-staffés</div><div class="kpi-value">${understaffed.length}</div></div>
    </div>

    ${unpaid.length ? `
    <div class="card">
      <h3>Licences à relancer (${unpaid.length})</h3>
      <div class="table-wrap"><table>
        <tbody>${unpaid.map(m => `<tr><td>${m.first_name} ${m.last_name}</td><td>${m.licence_status}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>` : ""}

    ${understaffed.length ? `
    <div class="card">
      <h3>Événements à venir qui manquent de bénévoles</h3>
      <div class="table-wrap"><table>
        <tbody>${understaffed.map(e => `<tr><td>${e.event_date}</td><td>${e.title}</td><td class="num">${countSignups(e.id)} / ${e.slots_needed}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>` : ""}

    ${lowStock.length ? `
    <div class="card">
      <h3>Stock matériel bas</h3>
      <div class="table-wrap"><table>
        <tbody>${lowStock.map(i => `<tr><td>${i.name}</td><td class="num">${i.quantity} ${i.unit || ""}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>` : ""}

    <div class="card">
      <h3>Championnat officiel (56 D1 Poule A)</h3>
      <p class="view-sub">L'équipe première (Cléguer Stiren FC) suit le championnat officiel du District du Morbihan.</p>

   Module : Licences & effectifs
--------------------------------------------------------------------- */
async function renderMembers(main){
  main.innerHTML = `<div class="view-head"><h1>Licences & effectifs</h1></div><div id="members-body">Chargement…</div>`;
  const { data, error } = await sb.from("members").select("*").eq("organization_id", state.orgId).order("last_name");
  const body = document.getElementById("members-body");
  if (error){ body.innerHTML = `<div class="auth-error">${error.message}</div>`; return; }
  state.members = data || [];

  const statusPill = s => ({
    payee: '<span class="pill pill-ok">Payée</span>',
    en_attente: '<span class="pill pill-warn">En attente</span>',
    expiree: '<span class="pill pill-bad">Expirée</span>',
    a_faire: '<span class="pill pill-muted">À faire</span>',
  })[s] || s;

  const statusOptions = ['a_faire','en_attente','payee','expiree']
    .map(s => `<option value="${s}">${({a_faire:'À faire', en_attente:'En attente', payee:'Payée', expiree:'Expirée'})[s]}</option>`).join("");

  body.innerHTML = `
    <div class="card">
      <h3>Ajouter un licencié</h3>
      <form id="member-form" class="form-grid">
        <div class="field"><label>Prénom</label><input name="first_name" required></div>
        <div class="field"><label>Nom</label><input name="last_name" required></div>
        <div class="field"><label>Contact parent</label><input name="parent_name"></div>
        <div class="field"><label>Email parent</label><input name="parent_email" type="email"></div>
        <div class="field"><label>Téléphone parent</label><input name="parent_phone" type="tel"></div>
        <div class="field" style="flex:2 1 260px"><label>Lien de paiement SumUp</label><input name="payment_link" type="url" placeholder="collé depuis l'appli SumUp Business"></div>
        <button class="btn btn-primary" type="submit">Ajouter</button>
      </form>
    </div>
    <div class="card">
      <h3>Import en masse (CSV)</h3>
      <p class="view-sub">Colonnes attendues : <code>prenom,nom,statut,email_parent,telephone_parent</code> (statut : a_faire / en_attente / payee / expiree). C'est le format le plus simple à produire depuis l'export Footclubs en attendant un import dédié.</p>
      <input type="file" id="csv-input" accept=".csv">
      <div id="csv-result" class="view-sub" style="margin-top:8px"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nom</th><th>Prénom</th><th>Statut licence</th><th>Contact parent</th><th>Paiement</th><th></th></tr></thead>
        <tbody>
          ${state.members.length ? state.members.map(m => `
            <tr data-id="${m.id}">
              <td>${m.last_name}</td>
              <td>${m.first_name}</td>
              <td>
                <select class="status-select" data-id="${m.id}">${statusOptions.replace(`value="${m.licence_status}"`, `value="${m.licence_status}" selected`)}</select>
              </td>
              <td>${m.parent_name || ""} ${m.parent_email ? "· " + m.parent_email : ""} ${m.parent_phone ? "· " + m.parent_phone : ""}</td>
              <td>
                ${m.payment_link ? `<a href="${m.payment_link}" target="_blank" class="btn btn-ghost btn-sm">Lien SumUp</a>` : ""}
                <button class="btn btn-ghost btn-sm edit-link-btn" data-id="${m.id}" title="Modifier le lien">✎</button>
                ${m.licence_status !== 'payee' ? `
                  <button class="btn btn-ghost btn-sm sumup-gen-btn" data-id="${m.id}" data-name="${m.first_name} ${m.last_name}">Générer paiement SumUp</button>
                  <button class="btn btn-ghost btn-sm relance-btn" data-id="${m.id}" data-name="${m.first_name} ${m.last_name}" data-email="${m.parent_email || ''}" data-link="${m.payment_link || ''}">Relancer par e-mail</button>
                ` : ""}
              </td>
              <td><button class="btn btn-ghost btn-sm delete-member-btn" data-id="${m.id}">🗑</button></td>
            </tr>`).join("") : `<tr class="empty-row"><td colspan="6">Aucun licencié pour l'instant.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  document.getElementById("member-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      organization_id: state.orgId,
      first_name: fd.get("first_name"),
      last_name: fd.get("last_name"),
      parent_name: fd.get("parent_name") || null,
      parent_email: fd.get("parent_email") || null,
      parent_phone: fd.get("parent_phone") || null,
      payment_link: fd.get("payment_link") || null,
    };
    const { error } = await sb.from("members").insert(payload);
    if (error) return alert(error.message);
    renderMembers(main);
  });

  document.querySelectorAll(".status-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      const { error } = await sb.from("members").update({ licence_status: sel.value }).eq("id", sel.dataset.id);
      if (error) return alert(error.message);
      renderMembers(main);
    });
  });

  document.querySelectorAll(".edit-link-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const current = state.members.find(m => m.id === btn.dataset.id)?.payment_link || "";
      const url = prompt("Lien de paiement SumUp :", current);
      if (url === null) return;
      const { error } = await sb.from("members").update({ payment_link: url || null }).eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderMembers(main);
    });
  });

  document.querySelectorAll(".delete-member-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer ce licencié ?")) return;
      const { error } = await sb.from("members").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderMembers(main);
    });
  });

  document.querySelectorAll(".relance-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const email = btn.dataset.email;
      let sentByEmail = false;
      if (email){
        const { error: mailError } = await sb.functions.invoke("send-email", { body: {
          to: email, subject: `Relance licence - ${btn.dataset.name}`,
          html: `<p>Bonjour,</p><p>Petit rappel : la licence de ${btn.dataset.name} n'est pas encore réglée.</p>${btn.dataset.link ? `<p><a href="${btn.dataset.link}">Payer en ligne</a></p>` : ""}`,
        }});
        sentByEmail = !mailError;
        if (mailError) console.warn("Email non envoyé (Brevo non configuré ?)", mailError);
      }
      const { error } = await sb.from("communications").insert({
        organization_id: state.orgId,
        type: "relance",
        subject: `Relance licence - ${btn.dataset.name}`,
        recipients_count: 1,
        sent_at: new Date().toISOString(),
      });
      if (error) return alert(error.message);
      alert(sentByEmail ? "E-mail de relance envoyé." : "Relance enregistrée, mais l'e-mail n'est pas parti (pas d'adresse parent, ou Brevo pas encore configuré).");
    });
  });

  document.querySelectorAll(".sumup-gen-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const amount = prompt(`Montant à demander pour ${btn.dataset.name} (€) :`, "80");
      if (!amount) return;
      const { data, error } = await sb.functions.invoke("sumup-create-checkout", { body: {
        member_id: btn.dataset.id, amount: Number(amount), description: `Licence - ${btn.dataset.name}`,
      }});
      if (error || data?.error){
        alert(`SumUp non configuré : ${data?.error || error.message}\n\nIl faut ajouter les secrets SUMUP_API_KEY et SUMUP_MERCHANT_CODE dans Supabase.`);
        return;
      }
      alert("Lien de paiement généré automatiquement et enregistré sur le licencié.");
      renderMembers(main);
    });
  });

  const csvInput = document.getElementById("csv-input");
  if (csvInput) csvInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const header = lines[0].split(",").map(h => h.trim().toLowerCase());
    const rows = lines.slice(1).map(line => {
      const cells = line.split(",");
      const obj = {};
      header.forEach((h, i) => obj[h] = (cells[i] || "").trim());
      return obj;
    });
    const validStatuses = ['a_faire','en_attente','payee','expiree'];
    const payload = rows.filter(r => r.nom && r.prenom).map(r => ({
      organization_id: state.orgId,
      first_name: r.prenom,
      last_name: r.nom,
      licence_status: validStatuses.includes(r.statut) ? r.statut : 'a_faire',
      parent_email: r.email_parent || null,
      parent_phone: r.telephone_parent || null,
    }));
    const result = document.getElementById("csv-result");
    if (!payload.length){ result.textContent = "Aucune ligne valide trouvée (colonnes nom/prenom manquantes ?)."; return; }
    const { error } = await sb.from("members").insert(payload);
    result.textContent = error ? `Erreur : ${error.message}` : `${payload.length} licencié(s) importé(s).`;
    if (!error) renderMembers(main);
  });
}

              <button class="btn btn-ghost btn-sm copy-reg-link-btn" data-id="${c.id}">Copier</button>

    <div class="card">

    <div class="card">

      <form id="rental-form" class="form-grid">
        <div class="field"><label>Article</label>
          <select name="item_id">${(items || []).filter(i => i.rentable).map(i => `<option value="${i.id}" data-rate="${i.daily_rate||0}">${i.name}</option>`).join("")}</select>

                <td>${r.renter_name} ${r.renter_contact ? "· " + r.renter_contact : ""}</td>
                <td>${r.start_date}${r.end_date ? " → " + r.end_date : ""}</td>
                <td class="num">${r.price ? Number(r.price).toFixed(2) + " €" : ""}</td>
                <td>
                  <select class="rental-status-select" data-id="${r.id}">
                    ${['reserve','en_cours','rendu'].map(s => `<option value="${s}" ${s===r.status?'selected':''}>${({reserve:'Réservé',en_cours:'En cours',rendu:'Rendu'})[s]}</option>`).join("")}
                  </select>
                </td>
                <td>${r.paid ? '<span class="pill pill-ok">Payé</span>' : `<button class="btn btn-ghost btn-sm mark-paid-rental-btn" data-id="${r.id}" data-name="${r.renter_name}" data-price="${r.price||0}" data-item="${r.equipment_items?.name||''}">Marquer payé</button>`}</td>

  document.getElementById("cal-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await sb.from("calendar_events").insert({
      organization_id: state.orgId,
      title: fd.get("title"),
      type: fd.get("type"),
      team_id: fd.get("team_id") || null,
      start_at: new Date(fd.get("start_at")).toISOString(),
      location: fd.get("location") || null,
      description: fd.get("description") || null,
    });
    if (error) return alert(error.message);
    renderCalendar(main);
  });

  document.querySelectorAll(".edit-cal-desc-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const current = (cal || []).find(c => c.id === btn.dataset.id)?.description || "";
      const text = prompt("Comment fonctionne cet événement (règles, horaires, consignes...) :", current);
      if (text === null) return;
      const { error } = await sb.from("calendar_events").update({ description: text || null }).eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.getElementById("equip-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await sb.from("equipment_items").insert({
      organization_id: state.orgId,
      name: fd.get("name"),
      category: fd.get("category") || null,
      quantity: Number(fd.get("quantity") || 0),
      rentable: fd.get("rentable") === "true",
      daily_rate: fd.get("daily_rate") ? Number(fd.get("daily_rate")) : null,
    });
    if (error) return alert(error.message);
    renderCalendar(main);
  });

  const rentalForm = document.getElementById("rental-form");
  if (rentalForm) rentalForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    if (!fd.get("item_id")) return alert("Marque d'abord un article comme louable.");
    const { error } = await sb.from("equipment_rentals").insert({
      organization_id: state.orgId,
      item_id: fd.get("item_id"),
      renter_name: fd.get("renter_name"),
      renter_contact: fd.get("renter_contact") || null,
      start_date: fd.get("start_date"),
      end_date: fd.get("end_date") || null,
      price: fd.get("price") ? Number(fd.get("price")) : null,
      deposit: fd.get("deposit") ? Number(fd.get("deposit")) : null,
    });
    if (error) return alert(error.message);
    renderCalendar(main);
  });

  document.querySelectorAll(".rental-status-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      const { error } = await sb.from("equipment_rentals").update({ status: sel.value }).eq("id", sel.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".mark-paid-rental-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await sb.from("equipment_rentals").update({ paid: true }).eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      if (Number(btn.dataset.price) > 0){
        await sb.from("finance_transactions").insert({
          organization_id: state.orgId,
          label: `Location ${btn.dataset.item} - ${btn.dataset.name}`,
          category: "location_materiel",
          type: "recette",
          amount: Number(btn.dataset.price),
        });
      }
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".del-rental-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer cette location ?")) return;
      const { error } = await sb.from("equipment_rentals").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".del-cal-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer cet événement ?")) return;
      const { error } = await sb.from("calendar_events").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".toggle-registration-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const opening = btn.dataset.open !== "true";
      let price = null, deadline = null;
      if (opening){
        price = prompt("Prix par personne (€) — laisser vide si gratuit :", "");
        deadline = prompt("Date limite d'inscription (AAAA-MM-JJ) — laisser vide si aucune :", "");
      }
      const { error } = await sb.from("calendar_events").update({
        registration_open: opening,
        registration_price: price ? Number(price) : null,
        registration_deadline: deadline || null,
      }).eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".copy-reg-link-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const link = `${location.origin}${location.pathname.replace('index.html','')}inscription.html?event=${btn.dataset.id}`;
      navigator.clipboard?.writeText(link).catch(() => {});
      alert(`Lien copié :\n${link}`);
    });
  });

  document.querySelectorAll(".reg-paid-check").forEach(chk => {
    chk.addEventListener("change", async () => {
      const { error } = await sb.from("event_registrations").update({ paid: chk.checked }).eq("id", chk.dataset.id);
      if (error) return alert(error.message);
    });
  });

  document.querySelectorAll(".del-reg-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer cette inscription ?")) return;
      const { error } = await sb.from("event_registrations").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".del-equip-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer cet article ?")) return;
      const { error } = await sb.from("equipment_items").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".convoke-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const eventId = btn.dataset.event, teamId = btn.dataset.team;
      let conv = (convs || []).find(c => c.event_id === eventId);
      if (!conv){
        const { data, error } = await sb.from("convocations").insert({
          organization_id: state.orgId, event_id: eventId, team_id: teamId,
        }).select().single();
        if (error) return alert(error.message);
        conv = data;
      }
      const { data: roster } = await sb.from("members").select("id, first_name, last_name").eq("organization_id", state.orgId).eq("team_id", teamId);
      const { data: already } = await sb.from("convocation_players").select("member_id").eq("convocation_id", conv.id);
      const alreadyIds = new Set((already || []).map(p => p.member_id));
      const toAdd = (roster || []).filter(m => !alreadyIds.has(m.id));
      if (toAdd.length){
        await sb.from("convocation_players").insert(toAdd.map(m => ({
          convocation_id: conv.id, organization_id: state.orgId, member_id: m.id,
        })));
      }
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".conv-status-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      const { error } = await sb.from("convocation_players").update({ status: sel.value }).eq("id", sel.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".del-convplayer-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await sb.from("convocation_players").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderCalendar(main);
    });
  });

  document.querySelectorAll(".send-convocation-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const convId = btn.dataset.conv, eventId = btn.dataset.event;
      const ev = (cal || []).find(c => c.id === eventId);
      const players = playersFor(convId);
      let sent = 0, failed = 0;
      for (const p of players){
        const { data: m } = await sb.from("members").select("parent_email, first_name, last_name").eq("id", p.member_id).single();
        if (!m?.parent_email) continue;
        const { error } = await sb.functions.invoke("send-email", { body: {
          to: m.parent_email, toName: `${m.first_name} ${m.last_name}`,
          subject: `Convocation - ${ev.title}`,
          html: `<p>Bonjour,</p><p>${m.first_name} ${m.last_name} est convoqué(e) pour : <strong>${ev.title}</strong> le ${new Date(ev.start_at).toLocaleString('fr-FR')}${ev.location ? ' à ' + ev.location : ''}.</p>`,
        }});
        if (error) failed++; else sent++;
      }
      await sb.from("communications").insert({
        organization_id: state.orgId, type: "convocation", subject: `Convocation - ${ev.title}`,
        event_id: eventId, recipients_count: sent, sent_at: new Date().toISOString(),
      });
      alert(sent || failed ? `Envoyé à ${sent} parent(s)${failed ? `, ${failed} échec(s) (Brevo non configuré ?)` : ""}.` : "Aucun e-mail parent renseigné pour ces joueurs.");
    });
  });
}

            <td><button class="btn btn-ghost btn-sm del-comm-btn" data-id="${c.id}">🗑</button></td></tr>
          `).join("") : `<tr class="empty-row"><td colspan="4">Aucune communication pour l'instant.</td></tr>`}
        </tbody>

  document.getElementById("comms-form").addEventListener("submit", async (e) => {

    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer cette communication ?")) return;
      const { error } = await sb.from("communications").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderComms(main);
    });

async function renderTournamentDetail(main, tournamentId){
  main.innerHTML = `<div class="view-head"><h1>Tournoi</h1></div><div id="tdetail-body">Chargement…</div>`;
  const [{ data: t }, { data: participants, error: e1 }, { data: matches, error: e2 }] = await Promise.all([
    sb.from("tournaments").select("*").eq("id", tournamentId).single(),
    sb.from("tournament_participants").select("*").eq("tournament_id", tournamentId).order("name"),
    sb.from("tournament_matches").select("*").eq("tournament_id", tournamentId),
  ]);
  const body = document.getElementById("tdetail-body");
  if (e1 || e2){ body.innerHTML = `<div class="auth-error">${(e1||e2).message}</div>`; return; }

  const nameOf = id => participants.find(p => p.id === id)?.name || "?";

  // classement
  const stats = {};
  (participants || []).forEach(p => stats[p.id] = { name: p.name, j:0, g:0, n:0, p:0, bp:0, bc:0, pts:0 });
  (matches || []).filter(m => m.played).forEach(m => {
    const h = stats[m.home_id], a = stats[m.away_id];
    if (!h || !a) return;
    h.j++; a.j++; h.bp += m.home_score; h.bc += m.away_score; a.bp += m.away_score; a.bc += m.home_score;
    if (m.home_score > m.away_score){ h.g++; h.pts += 3; a.p++; }
    else if (m.home_score < m.away_score){ a.g++; a.pts += 3; h.p++; }
    else { h.n++; a.n++; h.pts += 1; a.pts += 1; }
  });
  const standings = Object.values(stats).sort((a,b) => b.pts - a.pts || (b.bp-b.bc) - (a.bp-a.bc));

  body.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="back-to-tournaments" style="margin-bottom:12px">← Tous les tournois</button>
    <div class="view-head"><h1>${t.name}</h1><div class="view-sub">${t.start_date || ""}</div></div>
    <div class="card">
      <div class="card-row"><h3>Comment fonctionne ce tournoi</h3><button class="btn btn-ghost btn-sm" id="edit-tournament-desc-btn">✎ Modifier</button></div>
      <p class="view-sub" style="white-space:pre-wrap">${t.description || "Pas encore de description (format, horaires, règles...)."}</p>
    </div>

    <div class="card">
      <h3>Participants</h3>
      <form id="participant-form" class="form-grid">
        <div class="field"><label>Nom de l'équipe</label><input name="name" required></div>
        <button class="btn btn-primary" type="submit">Ajouter</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Équipe</th><th></th></tr></thead>
          <tbody>
            ${(participants || []).length ? participants.map(p => `
              <tr><td>${p.name}</td><td><button class="btn btn-ghost btn-sm del-participant-btn" data-id="${p.id}">🗑</button></td></tr>
            `).join("") : `<tr class="empty-row"><td colspan="2">Aucun participant.</td></tr>`}
          </tbody>
        </table>
      </div>
      ${(participants || []).length >= 2 ? `<button class="btn btn-ghost btn-sm" id="gen-matches-btn" style="margin-top:10px">Générer les matchs de poule</button>` : ""}
    </div>

    <div class="card">
      <h3>Classement</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Équipe</th><th class="num">J</th><th class="num">G</th><th class="num">N</th><th class="num">P</th><th class="num">BP</th><th class="num">BC</th><th class="num">Pts</th></tr></thead>
          <tbody>
            ${standings.length ? standings.map(s => `
              <tr><td>${s.name}</td><td class="num">${s.j}</td><td class="num">${s.g}</td><td class="num">${s.n}</td><td class="num">${s.p}</td><td class="num">${s.bp}</td><td class="num">${s.bc}</td><td class="num"><strong>${s.pts}</strong></td></tr>
            `).join("") : `<tr class="empty-row"><td colspan="8">Pas encore de match joué.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Matchs</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Domicile</th><th></th><th>Extérieur</th><th></th></tr></thead>
          <tbody>
            ${(matches || []).length ? matches.map(m => `
              <tr data-match="${m.id}">
                <td>${nameOf(m.home_id)}</td>
                <td class="num"><input class="score-input" data-id="${m.id}" data-side="home" type="number" min="0" style="width:50px" value="${m.home_score ?? ''}"></td>
                <td>${nameOf(m.away_id)}</td>
                <td class="num"><input class="score-input" data-id="${m.id}" data-side="away" type="number" min="0" style="width:50px" value="${m.away_score ?? ''}">
                  <button class="btn btn-ghost btn-sm del-match-btn" data-id="${m.id}">🗑</button>
                </td>
              </tr>
            `).join("") : `<tr class="empty-row"><td colspan="4">Pas encore de matchs - ajoute au moins 2 participants puis génère la poule.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;

  document.getElementById("back-to-tournaments").addEventListener("click", () => {
    state.currentTournamentId = null; renderTournaments(main);
  });

  document.getElementById("edit-tournament-desc-btn").addEventListener("click", async () => {
    const text = prompt("Comment fonctionne ce tournoi (format, horaires, règles...) :", t.description || "");
    if (text === null) return;
    const { error } = await sb.from("tournaments").update({ description: text || null }).eq("id", tournamentId);
    if (error) return alert(error.message);
    renderTournamentDetail(main, tournamentId);
  });

  document.getElementById("participant-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const { error } = await sb.from("tournament_participants").insert({
      tournament_id: tournamentId, organization_id: state.orgId, name: fd.get("name"),
    });
    if (error) return alert(error.message);
    renderTournamentDetail(main, tournamentId);
  });

  document.querySelectorAll(".del-participant-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await sb.from("tournament_participants").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderTournamentDetail(main, tournamentId);
    });
  });

  const genBtn = document.getElementById("gen-matches-btn");
  if (genBtn) genBtn.addEventListener("click", async () => {
    const pairs = [];
    for (let i = 0; i < participants.length; i++)
      for (let j = i+1; j < participants.length; j++)
        pairs.push({ tournament_id: tournamentId, organization_id: state.orgId, home_id: participants[i].id, away_id: participants[j].id });
    const { error } = await sb.from("tournament_matches").insert(pairs);
    if (error) return alert(error.message);
    renderTournamentDetail(main, tournamentId);
  });

  document.querySelectorAll(".score-input").forEach(input => {
    input.addEventListener("change", async () => {
      const row = document.querySelector(`tr[data-match="${input.dataset.id}"]`);
      const homeVal = row.querySelector('[data-side="home"]').value;
      const awayVal = row.querySelector('[data-side="away"]').value;
      const played = homeVal !== "" && awayVal !== "";
      const { error } = await sb.from("tournament_matches").update({
        home_score: homeVal === "" ? null : Number(homeVal),
        away_score: awayVal === "" ? null : Number(awayVal),
        played,
      }).eq("id", input.dataset.id);
      if (error) return alert(error.message);
      renderTournamentDetail(main, tournamentId);
    });
  });

  document.querySelectorAll(".del-match-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { error } = await sb.from("tournament_matches").delete().eq("id", btn.dataset.id);
      if (error) return alert(error.message);
      renderTournamentDetail(main, tournamentId);
    });
  });
}

  const { data, error } = await sb.from("invites").select("*").eq("organization_id", state.orgId).order("created_at", { ascending: false });

  const roleLabel = { president:'Président', bureau:'Bureau', tresorier:'Trésorier', secretaire:'Secrétaire', coach:'Coach', benevole:'Bénévole', membre:'Membre' };
  const roleOptions = Object.keys(roleLabel).map(r => `<option value="${r}">${roleLabel[r]}</option>`).join("");

  body.innerHTML = `

      <p class="view-sub">Pas d'envoi d'e-mail automatique pour l'instant : un lien est généré, à toi de le transmettre (WhatsApp, e-mail...). La personne clique, se crée un compte (ou se connecte) avec <strong>le même e-mail</strong>, et elle est rattachée automatiquement.</p>

      <div id="invite-result"></div>

      <table>
        <thead><tr><th>E-mail</th><th>Rôle</th><th>Statut</th><th></th></tr></thead>
        <tbody>
          ${(data || []).length ? data.map(i => `
            <tr>
              <td>${i.email}</td>
              <td>${roleLabel[i.role] || i.role}</td>
              <td>${i.accepted_at ? '<span class="pill pill-ok">Acceptée</span>' : '<span class="pill pill-warn">En attente</span>'}</td>

            </tr>
          `).join("") : `<tr class="empty-row"><td colspan="4">Aucune invitation pour l'instant.</td></tr>`}

      </table>

  document.getElementById("invite-form").addEventListener("submit", async (e) => {

    renderOrgAdmin(main);
  });

  document.querySelectorAll(".copy-invite-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const link = `${location.origin}${location.pathname}?invite=${btn.dataset.token}`;
      navigator.clipboard?.writeText(link).catch(() => {});
      alert(`Lien copié :\n${link}`);
    });
  });
}

/* ---------------------------------------------------------------------
   Bootstrap
--------------------------------------------------------------------- */
(async function init(){
  render();
  if (!SETUP_MODE){
    await loadSession();
    sb.auth.onAuthStateChange((_event, session) => {
      state.session = session;
      if (session) loadMembership().then(render); else render();
    });
  }
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  }
})();
</script>
